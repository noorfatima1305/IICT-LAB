<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Continental Hotel Reservation Form</title>
  <style>
    body {
      background-color: #e0e0e0;
      margin: 8px;
    }

    h1 {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: red;
      text-align: center;
      margin: 28px 0 20px 0;
    }

    table {
      width: 440px;
      margin: 0 auto;
      border: 2px outset gray;
      border-collapse: separate;
      border-spacing: 2px;
      background-color: #c8e4ff;
    }

    th, td {
      border: 1px inset gray;
      background-color: #c8e4ff;
      padding: 4px 6px;
    }

    th {
      width: 130px;
      font-family: "Times New Roman", serif;
      font-size: 16px;
      font-weight: bold;
      text-align: right;
      padding-right: 8px;
    }

    td {
      font-family: "Times New Roman", serif;
      font-size: 16px;
    }

    input[type="text"], input[type="email"] {
      font-size: 14px;
      padding: 2px 3px;
      border: 1px solid #999;
    }

    input[name="name"], input[name="email"], input[name="mobile"] {
      width: 195px;
    }

    input[name="arrival"] {
      width: 135px;
    }

    input[name="dep1"], input[name="dep2"] {
      width: 136px;
    }

    #send {
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Continental Hotel Reservation Form</h1>

  <form action="#" method="post">
    <table>
      <tr>
        <th>Name</th>
        <td><input type="text" name="name" placeholder="Enter your name"></td>
      </tr>
      <tr>
        <th>eMail</th>
        <td><input type="email" name="email" value="info@continental.pk"></td>
      </tr>
      <tr>
        <th>Mobile No</th>
        <td><input type="text" name="mobile" placeholder="Enter your cell number"></td>
      </tr>
      <tr>
        <th>Arrival Time</th>
        <td><input type="text" name="arrival" placeholder="Enter your arrival time"></td>
      </tr>
      <tr>
        <th>Departure</th>
        <td><input type="text" name="dep1"> <input type="text" name="dep2"></td>
      </tr>
      <tr>
        <th>Room Type</th>
        <td>
          <input type="radio" id="single" name="room" value="single"><label for="single">Single</label>
          <input type="radio" id="double" name="room" value="double"><label for="double">Double</label><br>
          <input type="radio" id="suite" name="room" value="suite"><label for="suite">Presidential Suite</label>
        </td>
      </tr>
      <tr>
        <th>Preferences</th>
        <td>
          <input type="checkbox" id="nosmoke" name="pref" value="nonsmoking"><label for="nosmoke">Non-Smoking</label><br>
          <input type="checkbox" id="internet" name="pref" value="internet"><label for="internet">Internet</label><br>
          <input type="checkbox" id="mattress" name="pref" value="mattress"><label for="mattress">Firm Mattress</label>
        </td>
      </tr>
      <tr>
        <th>Mode of Payment</th>
        <td>
          <input type="checkbox" id="cash" name="pay" value="cash"><label for="cash">Cash</label>
          <input type="checkbox" id="check" name="pay" value="check"><label for="check">Check</label><br>
          <input type="checkbox" id="card" name="pay" value="card"><label for="card">Credit Card</label>
          <select name="cardtype">
            <option>Select Card</option>
            <option>Visa</option>
            <option>MasterCard</option>
            <option>American Express</option>
          </select>
        </td>
      </tr>
      <tr>
        <td colspan="2" id="send"><input type="submit" value="Send Data"></td>
      </tr>
    </table>
  </form>

</body>
</html>
